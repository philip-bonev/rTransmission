[package]
name = "rtransmission-client"
version = "0.1.0"
description = "rTransmission Client"
authors = ["Philip Bonev"]
license = "GPL v2"
repository = ""
edition = "2024"

[lib]
name = "rtransmission_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
log = "0.4"

