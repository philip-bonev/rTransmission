<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/connection-settings.css" />
  <title>Connection Settings</title>
</head>
<body>
  <div class="dialog-header">
    <h2 data-i18n="conn.title">Connection Settings</h2>
    <button id="connection-settings-close-btn" class="dialog-close-btn">&times;</button>
  </div>
  <form id="connection-settings-form">
    <div class="form-group">
      <label for="rpc-host" data-i18n="conn.host">Host</label>
      <input type="text" id="rpc-host" placeholder="localhost" />
    </div>
    <div class="form-group">
      <label for="rpc-port" data-i18n="conn.port">Port</label>
      <input type="number" id="rpc-port" placeholder="9091" />
    </div>
    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" id="rpc-auth" />
        <span data-i18n="conn.auth">Authentication required</span>
      </label>
    </div>
    <div id="auth-fields" class="hidden">
      <div class="form-group">
        <label for="rpc-username" data-i18n="conn.username">Username</label>
        <input type="text" id="rpc-username" placeholder="username" />
      </div>
      <div class="form-group">
        <label for="rpc-password" data-i18n="conn.password">Password</label>
        <input type="password" id="rpc-password" placeholder="password" />
      </div>
    </div>
    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" id="rpc-https" />
        <span data-i18n="conn.https">Use HTTPS (TLS)</span>
      </label>
    </div>
    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" id="rpc-insecure" />
        <span data-i18n="conn.insecure">Ignore invalid certificates</span>
      </label>
    </div>
    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" id="rpc-auto-connect" />
        <span data-i18n="conn.auto_connect">Connect automatically on startup</span>
      </label>
    </div>
    <div class="dialog-actions">
      <button type="button" id="connection-settings-cancel-btn" class="dialog-btn-secondary" data-i18n="btn.cancel">Cancel</button>
      <button type="submit" class="dialog-btn-primary" data-i18n="btn.save">Save</button>
    </div>
  </form>
  <script src="/i18n.js"></script>
  <script src="/connection-settings.js" defer></script>
</body>
</html>
