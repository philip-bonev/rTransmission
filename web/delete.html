<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/delete.css" />
  <title>Remove Torrents</title>
</head>
<body>
  <div class="dialog-header">
    <h2 data-i18n="delete.title">Delete Torrent</h2>
    <button id="delete-close-btn" class="dialog-close-btn">&times;</button>
  </div>
  <form id="delete-form">
    <div class="form-group">
      <p id="delete-count" class="dialog-text"></p>
    </div>
    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" id="delete-data-checkbox" />
        <span data-i18n="delete.data">Also delete downloaded data</span>
      </label>
    </div>
    <div class="dialog-actions">
      <button type="button" id="delete-cancel-btn" class="dialog-btn-secondary" data-i18n="btn.cancel">Cancel</button>
      <button type="submit" class="dialog-btn-primary" data-i18n="btn.delete">Delete</button>
    </div>
  </form>
  <script src="/i18n.js"></script>
  <script src="/delete.js" defer></script>
</body>
</html>
