<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rTransmission Client</title>
  <script type="module" src="/main.js" defer></script>
</head>

<body>
  <div id="toolbar">
    <button id="settings-btn" class="toolbar-btn" title="Settings">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </button>
    <button id="connect-btn" class="toolbar-btn" title="Connect">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
      </svg>
    </button>
    <button id="disconnect-btn" class="toolbar-btn" title="Disconnect">
      <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="24" height="24">
        <!-- The Black Letter R Body -->
        <path d="M 7 5 
           H 14 
           C 17.5 5, 17.5 11, 14 11 
           H 10 
           V 16 
           H 7 
           V 5 
           Z 
           M 10 7 
           V 9 
           H 13 
           C 14.5 9, 14.5 7, 13 7 
           H 10 
           Z" fill="#000000" />

        <!-- The Black Diagonal Leg -->
        <path d="M 11.5 11 L 15.5 16 H 18.5 L 14 11 Z" fill="#000000" />

        <!-- The Red Feet at the End of the Legs -->
        <g fill="#FF2A2A">
          <!-- Red Left Foot -->
          <path d="M 6.5 16 
             H 10.5 
             C 10.5 17.5, 6.5 17.5, 6.5 16 Z" />

          <!-- Red Right Foot -->
          <path d="M 15 16 
             H 19 
             C 19 17.5, 15 17.5, 15 16 Z" />
        </g>
      </svg>

    </button>
  </div>


  <div id="viewer-container">
  </div>
</body>

</html>
