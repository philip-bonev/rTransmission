<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rTransmission Client</title>
  <script type="module" src="/main.js" defer></script>
</head>

<body>
  <div id="toolbar">
    <button id="theme-btn" class="toolbar-btn" title="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>
    <button id="connect-btn" class="toolbar-btn" title="Connect">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
      </svg>
    </button>
    <button id="disconnect-btn" class="toolbar-btn" title="Disconnect" disabled>
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l1.41-1.42" />
        <path d="M11 4.71a5 5 0 0 1 6.46 1.12l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-1.41 1.42" />
        <path d="M13 19.29a5 5 0 0 1-6.46-1.12l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </svg>
    </button>
    <button id="settings-btn" class="toolbar-btn" title="Settings">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </button>
  </div>
  <div id="torrent-viewer">
    <div id="torrent-list"></div>
    <div id="empty-state">
      <p>Connect to a Transmission daemon to get started</p>
    </div>
  </div>

  <div id="settings-overlay" class="overlay hidden">
    <div id="settings-dialog" class="dialog">
      <div class="dialog-header">
        <h2>Connection Settings</h2>
        <button id="settings-close-btn" class="dialog-close-btn">&times;</button>
      </div>
      <form id="settings-form">
        <div class="form-group">
          <label for="rpc-host">Host</label>
          <input type="text" id="rpc-host" placeholder="localhost" />
        </div>
        <div class="form-group">
          <label for="rpc-port">Port</label>
          <input type="number" id="rpc-port" placeholder="9091" />
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="rpc-auth" />
            Authentication required
          </label>
        </div>
        <div id="auth-fields" class="hidden">
          <div class="form-group">
            <label for="rpc-username">Username</label>
            <input type="text" id="rpc-username" placeholder="username" />
          </div>
          <div class="form-group">
            <label for="rpc-password">Password</label>
            <input type="password" id="rpc-password" placeholder="password" />
          </div>
        </div>
        <div class="dialog-actions">
          <button type="submit" class="dialog-btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</body>

</html>
