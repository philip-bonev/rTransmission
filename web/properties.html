<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/properties.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="properties_title">Torrent Properties</title>
  <script src="/i18n.js"></script>
  <script src="/properties.js" defer></script>
</head>

<body>
  <div id="properties-root">
    <div id="properties-message" data-i18n="properties.loading">Loading…</div>
    <div id="properties-content" class="hidden">
      <div class="properties-tabs">
        <button type="button" class="properties-tab active" data-tab="details" data-i18n="properties.tab_details">Details</button>
        <button type="button" class="properties-tab" data-tab="files" data-i18n="properties.tab_files">Files</button>
      </div>
      <div id="properties-top-panel" class="properties-panel" data-panel="details">
        <div class="panel-header" data-i18n="properties.details_header">Torrent details</div>
        <dl id="properties-info"></dl>
      </div>
      <div id="properties-bottom-panel" class="properties-panel hidden-tab" data-panel="files">
        <div class="panel-header" data-i18n="properties.files_header">Files</div>
        <div id="properties-files"></div>
      </div>
    </div>
  </div>

  <div id="file-context-menu" class="file-context-menu hidden">
    <button type="button" class="file-context-item" data-action="rename" data-i18n="file_op.rename">Rename</button>
    <button type="button" class="file-context-item" data-action="copy" data-i18n="file_op.copy_path">Copy Path</button>
    <button type="button" class="file-context-item" data-action="move" data-i18n="file_op.move">Move to…</button>
    <button type="button" class="file-context-item" data-action="delete" data-i18n="file_op.delete">Delete</button>
  </div>

  <div id="file-confirm-overlay" class="file-confirm-overlay hidden">
    <div class="file-confirm-dialog">
      <div id="file-confirm-title" class="file-confirm-title"></div>
      <div id="file-confirm-message" class="file-confirm-message"></div>
      <input type="text" id="file-confirm-input" class="file-confirm-input hidden" />
      <div class="file-confirm-actions">
        <button type="button" id="file-confirm-cancel" class="file-btn-cancel" data-i18n="btn.cancel">Cancel</button>
        <button type="button" id="file-confirm-ok" class="file-btn-ok" data-i18n="btn.ok">OK</button>
      </div>
    </div>
  </div>
</body>

</html>
