<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/settings.css" />
  <title>Settings</title>
</head>
<body>
  <div class="dialog-header">
    <h2 data-i18n="settings.title">Settings</h2>
    <button id="settings-close-btn" class="dialog-close-btn">&times;</button>
  </div>
  <div id="settings-scroll">
    <form id="settings-form">
      <div class="form-group">
        <label for="default-download-dir" data-i18n="settings.download_dir">Default download location</label>
        <input type="text" id="default-download-dir" placeholder="/path/to/downloads" spellcheck="false" />
      </div>
      <div class="form-group">
        <label for="theme-select" data-i18n="settings.theme">Theme</label>
        <select id="theme-select">
          <option value="auto" data-i18n="settings.theme_auto">Auto (follow system)</option>
          <option value="light" data-i18n="settings.theme_light">Light</option>
          <option value="dark" data-i18n="settings.theme_dark">Dark</option>
        </select>
      </div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" id="notifications-enabled" checked />
          <span data-i18n="settings.notifications">Show notifications when torrents finish</span>
        </label>
      </div>
      <div class="form-group">
        <label for="notification-duration" data-i18n="settings.notification_duration">Notification duration (seconds, 0 = system default)</label>
        <input type="number" id="notification-duration" min="0" max="60" placeholder="5" />
      </div>
      <div class="form-group">
        <button type="button" id="test-notification-btn" class="dialog-btn-secondary" data-i18n="settings.test_notification">Test notification</button>
      </div>
      <div class="form-separator"></div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" id="minimize-to-tray" checked />
          <span data-i18n="settings.minimize_to_tray">Minimize to system tray when closing</span>
        </label>
      </div>
      <div class="form-separator"></div>
      <div class="form-section-title" data-i18n="settings.queue">Queue</div>
      <div class="form-group">
        <label for="session-dl-queue-size" data-i18n="settings.dl_queue">Download queue size</label>
        <input type="number" id="session-dl-queue-size" min="1" max="100" placeholder="5" disabled />
      </div>
      <div class="form-group">
        <label for="session-seed-ratio-limit" data-i18n="settings.seed_ratio">Stop seeding at ratio</label>
        <input type="number" id="session-seed-ratio-limit" min="0" step="0.1" placeholder="2.0" disabled />
      </div>
      <div class="form-group">
        <label for="session-idle-seeding-limit" data-i18n="settings.idle_seed">Stop seeding if idle for (min)</label>
        <input type="number" id="session-idle-seeding-limit" min="1" max="40320" placeholder="30" disabled />
      </div>
      <div class="form-separator"></div>
      <div class="form-section-title" data-i18n="settings.speed_limits">Speed Limits</div>
      <div class="form-group">
        <label for="session-speed-dl" data-i18n="settings.dl_speed">Download speed limit (KB/s, 0 = unlimited)</label>
        <input type="number" id="session-speed-dl" min="0" placeholder="100" disabled />
      </div>
      <div class="form-group">
        <label for="session-speed-ul" data-i18n="settings.ul_speed">Upload speed limit (KB/s, 0 = unlimited)</label>
        <input type="number" id="session-speed-ul" min="0" placeholder="100" disabled />
      </div>
      <div class="form-separator"></div>
      <div class="form-section-title" data-i18n="settings.alt_speeds">Alternate Speed Limits</div>
      <div class="form-group">
        <label for="session-alt-dl" data-i18n="settings.alt_dl">Download (KB/s)</label>
        <input type="number" id="session-alt-dl" min="0" placeholder="50" disabled />
      </div>
      <div class="form-group">
        <label for="session-alt-ul" data-i18n="settings.alt_ul">Upload (KB/s)</label>
        <input type="number" id="session-alt-ul" min="0" placeholder="50" disabled />
      </div>
    </form>
  </div>
  <div class="dialog-actions">
    <button type="button" id="settings-cancel-btn" class="dialog-btn-secondary" data-i18n="btn.cancel">Cancel</button>
    <button type="button" id="settings-save-btn" class="dialog-btn-primary" data-i18n="btn.save">Save</button>
  </div>
  <script src="/i18n.js"></script>
  <script src="/settings.js" defer></script>
</body>
</html>
